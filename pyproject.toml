[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=streamstats --cov-report=term-missing"

[tool.coverage.run]
source = ["streamstats"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true